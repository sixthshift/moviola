<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>morph-regroup</title>
<!-- scrolly:css -->
<style>/*!
 * scrolly.css — structural layer only.
 *
 * Owns: sticky frame, layouts, mobile collapse, visibility mechanics.
 * Does not own: your typography, colors, or graphic. Style those yourself,
 * reacting to .is-active / [data-active-step] / --step-progress.
 *
 * Knobs (CSS custom properties, set them on .scrolly or :root):
 *   --scrolly-card-bg   background of step cards in overlay/mobile modes
 *   --scrolly-card-fg   text color of step cards in overlay/mobile modes
 */

.scrolly {
  position: relative;
}

/* ---- the pinned graphic ------------------------------------------------- */

.scrolly > figure {
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* graphic children stack for crossfades */
.scrolly > figure > * {
  grid-area: 1 / 1;
}

/* §15.3: the camera is geometry, not presentation — no transition here.
   The value is already scroll-scrubbed (recomputed every frame from cached
   endpoints), so animating it too would fight the reader's own scroll. */
.scrolly.is-ready [data-camera] {
  transform: var(--camera-transform, none);
}

/* step-driven visibility — hiding is scoped under .is-ready (stamped by the
   runtime at init) so a page whose JS never ran stays fully readable */
.scrolly.is-ready [data-show] {
  opacity: 0;
  transition: opacity 0.4s ease;
}

.scrolly.is-ready [data-show].is-shown {
  opacity: 1;
}

/* §15.2: scrub any element's own @keyframes against its stamped --t
   (0..1, one-time set by the runtime). Duration is normalized — the
   keyframes are the timeline; the author owns animation-name only. */
.scrolly.is-ready [data-scrub] {
  animation-duration: 1s;
  animation-play-state: paused;
  animation-fill-mode: both;
  animation-delay: calc(var(--t, 0) * -1s);
}

/* ---- steps --------------------------------------------------------------- */

.scrolly > .step {
  position: relative;
  z-index: 1;
  min-height: 90vh;
  min-height: 90dvh;
  display: grid;
  align-content: center;
}

/* ---- side layouts -------------------------------------------------------- */

.scrolly[data-layout="side-right"],
.scrolly[data-layout="side-left"] {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 2rem;
}

.scrolly[data-layout="side-right"] > figure,
.scrolly[data-layout="side-left"] > figure {
  grid-row: 1 / span 999;
}

.scrolly[data-layout="side-right"] > figure {
  grid-column: 2;
}
.scrolly[data-layout="side-right"] > .step {
  grid-column: 1;
}
.scrolly[data-layout="side-left"] > figure {
  grid-column: 1;
}
.scrolly[data-layout="side-left"] > .step {
  grid-column: 2;
}

/* ---- overlay layout ------------------------------------------------------ */

.scrolly[data-layout="overlay"] {
  display: grid;
}

.scrolly[data-layout="overlay"] > figure {
  grid-column: 1;
  grid-row: 1 / span 999;
}

.scrolly[data-layout="overlay"] > .step {
  grid-column: 1;
  justify-self: center;
  width: min(34rem, calc(100% - 2rem));
}

/* A step's content reads as a card over the graphic. Keep each step's
   content in a single block (wrap in a div if it's more than one). */
.scrolly[data-layout="overlay"] > .step > * {
  background: var(--scrolly-card-bg, rgba(255, 255, 255, 0.92));
  color: var(--scrolly-card-fg, inherit);
  padding: 1rem 1.25rem;
  border-radius: 0.5rem;
}

/* ---- mobile: side layouts collapse to overlay ---------------------------- */

@media (max-width: 720px) {
  .scrolly[data-layout="side-right"],
  .scrolly[data-layout="side-left"] {
    grid-template-columns: minmax(0, 1fr);
    column-gap: 0;
  }

  .scrolly[data-layout="side-right"] > figure,
  .scrolly[data-layout="side-left"] > figure,
  .scrolly[data-layout="side-right"] > .step,
  .scrolly[data-layout="side-left"] > .step {
    grid-column: 1;
  }

  .scrolly[data-layout="side-right"] > .step,
  .scrolly[data-layout="side-left"] > .step {
    justify-self: center;
    width: min(34rem, calc(100% - 2rem));
  }

  .scrolly[data-layout="side-right"] > .step > *,
  .scrolly[data-layout="side-left"] > .step > * {
    background: var(--scrolly-card-bg, rgba(255, 255, 255, 0.92));
    color: var(--scrolly-card-fg, inherit);
    padding: 1rem 1.25rem;
    border-radius: 0.5rem;
  }
}

/* ---- accessibility & print ----------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .scrolly.is-ready [data-show] {
    transition: none;
  }

  /* every scrub becomes a cut at the chapter midpoint (§15.2) */
  .scrolly.is-ready [data-scrub] {
    animation-delay: calc(round(var(--t, 0)) * -1s);
  }
}

@media print {
  .scrolly > figure {
    position: static;
    height: auto;
    overflow: visible;
  }

  .scrolly > figure > * {
    grid-area: auto;
  }

  .scrolly.is-ready [data-show] {
    opacity: 1;
  }

  .scrolly > .step {
    min-height: 0;
  }
}
</style>
<!-- /scrolly:css -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 sans-serif; background: #fff; color: #111; }

  /*
   * §15.4 data-morph fixture: four named squares re-sort into a different
   * left-to-right order every step. Each keeps a stable view-transition-name
   * across the whole story, so the runtime's atomic data-active-step write
   * (§5.2) — wrapped in a View Transition because the root carries
   * data-morph — makes the browser fly each square to its new slot instead
   * of a plain cut. The order itself is plain CSS driven off
   * [data-active-step]; scrolly never touches layout math.
   */
  .rack { display: flex; gap: 12px; }
  .dot { width: 60px; height: 60px; border-radius: 8px; }
  .dot-a { background: #e33333; view-transition-name: dot-a; order: var(--order-a, 1); }
  .dot-b { background: #33aa77; view-transition-name: dot-b; order: var(--order-b, 2); }
  .dot-c { background: #3377ee; view-transition-name: dot-c; order: var(--order-c, 3); }
  .dot-d { background: #eeaa33; view-transition-name: dot-d; order: var(--order-d, 4); }

  .scrolly[data-active-step="s1"] .rack { --order-a: 1; --order-b: 2; --order-c: 3; --order-d: 4; }
  .scrolly[data-active-step="s2"] .rack { --order-a: 4; --order-b: 3; --order-c: 2; --order-d: 1; }
  .scrolly[data-active-step="s3"] .rack { --order-a: 2; --order-b: 4; --order-c: 1; --order-d: 3; }
  .scrolly[data-active-step="s4"] .rack { --order-a: 3; --order-b: 1; --order-c: 4; --order-d: 2; }
</style>
</head>
<body>

<article class="scrolly" id="story" data-offset="0.5" data-layout="side-right" data-morph>
  <figure>
    <div class="rack">
      <div class="dot dot-a"></div>
      <div class="dot dot-b"></div>
      <div class="dot dot-c"></div>
      <div class="dot dot-d"></div>
    </div>
  </figure>

  <section class="step" id="s1"><p>one — a, b, c, d</p></section>
  <section class="step" id="s2"><p>two — d, c, b, a</p></section>
  <section class="step" id="s3"><p>three — c, a, d, b</p></section>
  <section class="step" id="s4"><p>four — b, d, a, c</p></section>

</article>
