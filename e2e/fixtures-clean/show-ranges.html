<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>show-ranges</title>
<!-- scrolly:css -->
<style>/*!
 * scrolly.css — structural layer only.
 *
 * Owns: sticky frame, layouts, mobile collapse, visibility mechanics.
 * Does not own: your typography, colors, or graphic. Style those yourself,
 * reacting to .is-active / [data-active-step] / --step-progress.
 *
 * Knobs (CSS custom properties, set them on .scrolly or :root):
 *   --scrolly-card-bg   background of step cards in overlay/mobile modes
 *   --scrolly-card-fg   text color of step cards in overlay/mobile modes
 */

.scrolly {
  position: relative;
}

/* ---- the pinned graphic ------------------------------------------------- */

.scrolly > figure {
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* graphic children stack for crossfades */
.scrolly > figure > * {
  grid-area: 1 / 1;
}

/* §15.3: the camera is geometry, not presentation — no transition here.
   The value is already scroll-scrubbed (recomputed every frame from cached
   endpoints), so animating it too would fight the reader's own scroll. */
.scrolly.is-ready [data-camera] {
  transform: var(--camera-transform, none);
}

/* step-driven visibility — hiding is scoped under .is-ready (stamped by the
   runtime at init) so a page whose JS never ran stays fully readable */
.scrolly.is-ready [data-show] {
  opacity: 0;
  transition: opacity 0.4s ease;
}

.scrolly.is-ready [data-show].is-shown {
  opacity: 1;
}

/* §15.2: scrub any element's own @keyframes against its stamped --t
   (0..1, one-time set by the runtime). Duration is normalized — the
   keyframes are the timeline; the author owns animation-name only. */
.scrolly.is-ready [data-scrub] {
  animation-duration: 1s;
  animation-play-state: paused;
  animation-fill-mode: both;
  animation-delay: calc(var(--t, 0) * -1s);
}

/* ---- steps --------------------------------------------------------------- */

.scrolly > .step {
  position: relative;
  z-index: 1;
  min-height: 90vh;
  min-height: 90dvh;
  display: grid;
  align-content: center;
}

/* ---- side layouts -------------------------------------------------------- */

.scrolly[data-layout="side-right"],
.scrolly[data-layout="side-left"] {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 2rem;
}

.scrolly[data-layout="side-right"] > figure,
.scrolly[data-layout="side-left"] > figure {
  grid-row: 1 / span 999;
}

.scrolly[data-layout="side-right"] > figure {
  grid-column: 2;
}
.scrolly[data-layout="side-right"] > .step {
  grid-column: 1;
}
.scrolly[data-layout="side-left"] > figure {
  grid-column: 1;
}
.scrolly[data-layout="side-left"] > .step {
  grid-column: 2;
}

/* ---- overlay layout ------------------------------------------------------ */

.scrolly[data-layout="overlay"] {
  display: grid;
}

.scrolly[data-layout="overlay"] > figure {
  grid-column: 1;
  grid-row: 1 / span 999;
}

.scrolly[data-layout="overlay"] > .step {
  grid-column: 1;
  justify-self: center;
  width: min(34rem, calc(100% - 2rem));
}

/* A step's content reads as a card over the graphic. Keep each step's
   content in a single block (wrap in a div if it's more than one). */
.scrolly[data-layout="overlay"] > .step > * {
  background: var(--scrolly-card-bg, rgba(255, 255, 255, 0.92));
  color: var(--scrolly-card-fg, inherit);
  padding: 1rem 1.25rem;
  border-radius: 0.5rem;
}

/* ---- mobile: side layouts collapse to overlay ---------------------------- */

@media (max-width: 720px) {
  .scrolly[data-layout="side-right"],
  .scrolly[data-layout="side-left"] {
    grid-template-columns: minmax(0, 1fr);
    column-gap: 0;
  }

  .scrolly[data-layout="side-right"] > figure,
  .scrolly[data-layout="side-left"] > figure,
  .scrolly[data-layout="side-right"] > .step,
  .scrolly[data-layout="side-left"] > .step {
    grid-column: 1;
  }

  .scrolly[data-layout="side-right"] > .step,
  .scrolly[data-layout="side-left"] > .step {
    justify-self: center;
    width: min(34rem, calc(100% - 2rem));
  }

  .scrolly[data-layout="side-right"] > .step > *,
  .scrolly[data-layout="side-left"] > .step > * {
    background: var(--scrolly-card-bg, rgba(255, 255, 255, 0.92));
    color: var(--scrolly-card-fg, inherit);
    padding: 1rem 1.25rem;
    border-radius: 0.5rem;
  }
}

/* ---- accessibility & print ----------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .scrolly.is-ready [data-show] {
    transition: none;
  }

  /* every scrub becomes a cut at the chapter midpoint (§15.2) */
  .scrolly.is-ready [data-scrub] {
    animation-delay: calc(round(var(--t, 0)) * -1s);
  }
}

@media print {
  .scrolly > figure {
    position: static;
    height: auto;
    overflow: visible;
  }

  .scrolly > figure > * {
    grid-area: auto;
  }

  .scrolly.is-ready [data-show] {
    opacity: 1;
  }

  .scrolly > .step {
    min-height: 0;
  }
}
</style>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 sans-serif; background: #fff; color: #111; }

  /*
   * §16.1 data-show ranges, the clean case: every well-formed span form on one
   * story of three steps (a, b, c), so membership is readable by eye —
   *
   *   #open   data-show="b.."   -> b, c
   *   #mixed  data-show="a c.." -> a, c        (bare + open-ended union)
   *   #all    data-show=".."    -> a, b, c
   *   #upto   data-show="..b"   -> a, b
   *   #closed data-show="a..b"  -> a, b        (both endpoints named)
   *
   * The bars stack in the sticky figure (scrolly.css grid-area) and only the
   * ones whose set holds the active step id are opaque. Nothing here is a
   * diagnostic trigger: every endpoint names a real step, so the page must
   * print zero `scrolly:` warnings.
   */
  .scrolly > .step { min-height: 100vh; }
  .stack { display: grid; gap: 12px; width: 320px; }
  .bar { height: 48px; border-radius: 6px; color: #fff; padding: 0.75rem; font-weight: 700; }
  #open { background: #e33333; }
  #mixed { background: #33aa77; }
  #all { background: #3377ee; }
  #upto { background: #b05ccc; }
  #closed { background: #d2802a; }
</style>
</head>
<body>

<article class="scrolly" id="story" data-offset="0.5" data-layout="side-right">
  <figure>
    <div class="stack">
      <div class="bar" id="open" data-show="b..">b..</div>
      <div class="bar" id="mixed" data-show="a c..">a c..</div>
      <div class="bar" id="all" data-show="..">..</div>
      <div class="bar" id="upto" data-show="..b">..b</div>
      <div class="bar" id="closed" data-show="a..b">a..b</div>
    </div>
  </figure>

  <section class="step" id="a"><p>step a — only the open-start spans cover it.</p></section>
  <section class="step" id="b"><p>step b — every span except the bare-plus-open union covers it.</p></section>
  <section class="step" id="c"><p>step c — the open-ended spans run to here.</p></section>

</article>
